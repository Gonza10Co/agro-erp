name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: el postinstall del esbuild anidado (vite, 0.25.x) valida
      # contra el binario hoisted (0.28.x) y revienta npm ci en Linux. Nada de acá
      # depende de postinstalls: prisma generate va explícito, argon2 trae prebuilds
      # y esbuild resuelve su binario vía @esbuild/* (optionalDependencies).
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        working-directory: backend
      - run: npm run build --workspace backend
      - run: npm test --workspace backend

  frontend:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Mismo --ignore-scripts que el job backend (ver comentario arriba).
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace frontend
      - run: npm test --workspace frontend -- --watch=false --browsers=ChromeHeadless
